spring:
  application:
    name: cnpm-project-support-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/${DB_NAME:cnpm_project_support}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:cnpm_user}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${APP_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-}]"

app:
  security:
    integration-encryption-key: ${INTEGRATION_ENCRYPTION_KEY}
