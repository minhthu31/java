spring:
  datasource:
    url: jdbc:h2:mem:cnpm_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: TRUE

app:
  jwt:
    secret: test-only-jwt-secret-key-with-at-least-32-bytes
    expiration-ms: 3600000
  security:
    integration-encryption-key: test-only-encryption-key-32-characters
